    # GitHub cron runs in UTC. 19:30 UTC = 1:00 AM IST (next day).
    # Runs on days 1, 7, 13, 19, 25, 31 of each month, so the longest gap is 6 days.
    - cron: '30 19 */6 * *'
  workflow_dispatch: {}  # manual trigger from the Actions tab, for testing

